[package]
name = "drahtseilakt-toolbox"
version = "0.1.0"
description = "Prepares levels for the game on the player's machine: remastered levels with rounder shapes and larger textures"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "drahtseilakt-toolbox"
path = "src/main.rs"

[dependencies]
gamedata = { path = "../gamedata" }
level = { path = "../level" }
glam = "=0.34.1"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "tga", "png", "jpeg"] }
serde_json = "=1.0.154"

[lints]
workspace = true
