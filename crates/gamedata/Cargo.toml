[package]
name = "gamedata"
version = "0.1.0"
description = "The player's copy of the game and the level folders: finding files and textures, the level table, loading and exporting levels; shared by the game and the toolbox"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
level = { path = "../level" }
nmo = { path = "../nmo" }
# matrices for a model pack's looks (assets.rs, attach_looks); already pinned in the lock through the game
glam = "=0.34.1"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "tga", "png", "jpeg"] }

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW and O_NONBLOCK for opening untrusted files (package.rs); already in the lock through wgpu and cpal
libc = "=0.2.189"

[lints]
workspace = true

[dev-dependencies]
fuzzkit = { path = "../fuzzkit" }
serde_json = "=1.0.154"
